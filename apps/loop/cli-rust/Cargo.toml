[package]
name = "loop-cli"
version = "0.1.0"
edition = "2021"
description = "CLI client for loop (embedded Traverse runtime)"
license = "MIT"

[[bin]]
name = "loop"
path = "src/main.rs"

[dependencies]
loop-core-rs = { path = "../loop-core-rs" }
clap = { version = "4", features = ["derive", "env"] }
colored = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
